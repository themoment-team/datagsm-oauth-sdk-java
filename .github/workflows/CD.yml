name: CD

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 태그(예: 2.0.1)와 build.gradle.kts의 version이 다르면 잘못된 버전이 배포되므로 막는다
      - name: Check tag matches project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(./gradlew properties -q | awk '/^version:/ {print $2}')
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::태그($TAG)와 build.gradle.kts 버전($VERSION)이 다릅니다."
            exit 1
          fi

      # publishToMavenCentral은 업로드와 검증까지만 하고, 공개는 Central Portal에서 직접 누른다.
      # 자동 공개로 바꾸려면 publishAndReleaseToMavenCentral을 사용한다.
      - name: Publish to Maven Central
        run: ./gradlew clean publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
